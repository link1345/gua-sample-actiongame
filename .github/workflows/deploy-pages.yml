name: Build and deploy Godot Web game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_EXECUTABLE: ${{ github.workspace }}\Godot_v4.7-stable_win64_console.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache Godot Web templates
        uses: actions/cache@v4
        with:
          path: .godot/export-template-cache
          key: godot-4.7-stable-export-templates

      - name: Install Godot 4.7 editor
        shell: pwsh
        run: |
          $archive = "Godot_v4.7-stable_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/$archive" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath .
          if (-not (Test-Path -LiteralPath $env:GODOT_EXECUTABLE)) {
            throw "Godot console executable was not extracted: $env:GODOT_EXECUTABLE"
          }

      - name: Install pinned Gua and Web templates
        shell: pwsh
        run: |
          scripts/install-gua.ps1
          scripts/install-godot-web-templates.ps1

      - name: Verify TypeScript and Godot mission
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "bun install failed with exit code $LASTEXITCODE" }
          bun run check:webmcp
          if ($LASTEXITCODE -ne 0) { throw "WebMCP type check failed with exit code $LASTEXITCODE" }
          $extensionPath = "addons/gua/gua.gdextension"
          $disabledExtensionPath = "$extensionPath.ci-import-disabled"
          Move-Item -LiteralPath $extensionPath -Destination $disabledExtensionPath
          try {
            & $env:GODOT_EXECUTABLE --headless --import --path .
            $importExitCode = $LASTEXITCODE
          }
          finally {
            Move-Item -LiteralPath $disabledExtensionPath -Destination $extensionPath
          }
          if ($importExitCode -ne 0) { throw "Godot import failed with exit code $importExitCode" }
          & $env:GODOT_EXECUTABLE --headless --path . --script res://tests/mission_smoke.gd
          if ($LASTEXITCODE -ne 0) { throw "Godot mission smoke failed with exit code $LASTEXITCODE" }

      - name: Verify live Semantic UI with Gua.Testing
        shell: pwsh
        run: |
          dotnet restore tests/GuaSignalRelay.Tests.csproj --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          dotnet test tests/GuaSignalRelay.Tests.csproj --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Gua.Testing UI tests failed with exit code $LASTEXITCODE" }

      - name: Build Web Release
        shell: pwsh
        run: scripts/build-web.ps1 -GodotExecutable $env:GODOT_EXECUTABLE

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

