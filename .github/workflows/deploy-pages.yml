name: Build and deploy Godot Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache Godot Web templates
        uses: actions/cache@v4
        with:
          path: .godot/export-template-cache
          key: godot-4.7-stable-export-templates

      - name: Install Godot 4.7 editor
        shell: bash
        run: |
          curl -fsSLO https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64

      - name: Install pinned Gua and Web templates
        shell: pwsh
        run: |
          scripts/install-gua.ps1
          scripts/install-godot-web-templates.ps1

      - name: Verify TypeScript and Godot mission
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run check:webmcp
          ./Godot_v4.7-stable_linux.x86_64 --headless --import --path .
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/mission_smoke.gd

      - name: Verify live Semantic UI with Gua.Testing
        env:
          GODOT_EXECUTABLE: ${{ github.workspace }}/Godot_v4.7-stable_linux.x86_64
        run: |
          dotnet restore tests/GuaSignalRelay.Tests.csproj --configfile NuGet.Config
          dotnet test tests/GuaSignalRelay.Tests.csproj --no-restore

      - name: Build Web Release
        shell: pwsh
        run: scripts/build-web.ps1 -GodotExecutable "$PWD/Godot_v4.7-stable_linux.x86_64"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

